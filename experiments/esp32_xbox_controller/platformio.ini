[platformio]
default_envs = esp32_xbox

[env:esp32_xbox]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = espidf
extra_scripts = pre:prepare_bluepad32.py
upload_port = /dev/ttyUSB0
; Keep the transfer at the initial connection speed for USB serial reliability.
upload_speed = 115200
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_filters = direct
board_build.partitions = partitions.csv
