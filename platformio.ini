[platformio]
default_envs = mega2560
; Use the project root so sources under experiments/ can be compiled too.
src_dir = .

[env:mega2560]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
; Compile only the launcher, ultrasonic sensor class, and current experiment.
build_src_filter =
    +<src/main.cpp>
    +<src/UltrasonicSensor.cpp>
    +<experiments/ultrasonic/exp001.cpp>
